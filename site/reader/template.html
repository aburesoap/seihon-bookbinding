<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="generator" content="Seihon (https://github.com/aburesoap/seihon-bookbinding)">
<title>{{TITLE}}</title>
<script>
  // 保存済みのテーマを描画前に反映する（ちらつき防止）.
  try {
    var theme = localStorage.getItem("seihon:reader-theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch (e) {}
</script>
<style>
{{STYLE}}
</style>
</head>
<body>
<div class="book" id="book">
  <header class="bar bar-top">
    <div class="bar-start">
      <button type="button" class="icon-btn" id="btn-toc" title="目次・しおり一覧（T）" aria-label="目次・しおり一覧">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <h1 class="title" id="title">{{TITLE}}</h1>
    </div>
    <div class="bar-buttons">
      <button type="button" class="icon-btn" id="btn-bookmark" title="しおりを挟む（B）" aria-label="しおりを挟む" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-5-4-5 4z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-layout" title="見開き／単ページの切り替え" aria-label="見開き／単ページの切り替え">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-spread"><path d="M3 5h8v14H3zM13 5h8v14h-8z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-single"><path d="M7 4h10v16H7z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-theme" aria-label="テーマの切り替え">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-fullscreen" title="全画面表示（F）" aria-label="全画面表示">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <footer class="bar bar-bottom">
    <button type="button" class="nav-btn" id="btn-left" aria-label="左のページへ">&#x2039;</button>
    <input type="range" class="slider" id="slider" min="0" value="0" aria-label="ページ移動">
    <span class="page-label" id="page-label"></span>
    <button type="button" class="nav-btn" id="btn-right" aria-label="右のページへ">&#x203A;</button>
  </footer>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <nav class="drawer" id="drawer" aria-label="目次・しおり" hidden>
    <div class="drawer-head">
      <span>目次・しおり</span>
      <button type="button" class="icon-btn" id="btn-drawer-close" aria-label="閉じる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </nav>

  <form class="lock" id="lock" hidden>
    <p class="lock-title">{{TITLE}}</p>
    <p class="lock-text">この本はパスワードで保護されています. </p>
    <input type="password" id="lock-input" placeholder="パスワード" autocomplete="current-password" required>
    <button type="submit">開く</button>
    <p class="lock-error" id="lock-error" hidden></p>
  </form>
</div>
<script type="application/json" id="book-data">{{DATA}}</script>
<script>
{{SCRIPT}}
</script>
</body>
</html>
